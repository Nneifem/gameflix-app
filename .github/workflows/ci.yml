      - name: Build Docker image
        run: docker build -t gameflix-backend:ci .

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: gameflix-backend:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Archive SBOM with this build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Trivy report (HIGH and CRITICAL, does not fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gameflix-backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gameflix-backend:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
