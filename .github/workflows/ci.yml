name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Check the jar was created
        run: ls -l target/*.jar

      - name: Build Docker image
        run: docker build -t gameflix-backend:ci .

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: gameflix-backend:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Archive SBOM with this build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

- name: Scan for critical vulnerabilities
  run: |
    trivy image --severity CRITICAL --exit-code 1 gameflix-app:latest
