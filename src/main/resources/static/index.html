<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Sign up and register -->
<main id="auth" class="container py-5">
    <div class="row align-items-center g-5 min-vh-100">
        <div class="col-lg-6 mx-auto">
            <h1 class="text-center mb-5">GameFlix</h1>
            <p class="lead text-body-secondary mt-4" style="max-width:30ch">Browse and play through over hundred.</p>
        </div>
        <div class="col-lg-5 offset-lg-1">
            <div class="card p-4">
                <ul class="nav nav-pills nav-fill mb-3">
                    <li class="nav-item"><button id="tabLogin" class="nav-link active" type="button">Sign in</button></li>
                    <li class="nav-item"><button id="tabReg" class="nav-link" type="button">Create Account</button></li>
                </ul>
                <div id="flName" class="row g-2 d-none">
                    <div class="col-6"><label for="fn" class="form-label">First Name</label><input id="fn" class="form-control"></div>
                    <div class="col-6"><label for="ln" class="form-label">Last Name</label><input id="ln" class="form-control"></div>
                </div>
                <div id="userName" class="d-none mt-2"><label for="un" class="form-label">Username</label><input id="un" class="form-control"></div>
                <label for="em" class="form-label mt-2">Email</label>
                <input id="em" type="email" class="form-control">
                <label for="pw" class="form-label mt-2">Password (must be at least 8 characters)</label>
                <input id="pw" type="password" class="form-control">
                <div id="authError" class="text-danger small mt-3" role="alert" style="min-height:1.4rem"></div>
                <button id="authGo" class="btn btn-primary mt-2" type="button">Sign In</button>
            </div>
        </div>
    </div>
</main>

<!-- Subscription page after creating an account -->
<main id="picker" class="container py-5 text-center d-none">
    <h1 class="brand display-5 fw-bold">GameFlix</h1>
    <h2 class="mt-4">Choose your plan</h2>
    <p class="text-body-secondary">Pick a plan to start playing.</p>
    <div class="row row-cols-1 row-cols-md-3 g-3 mt-1 text-start" id="pickPlans"></div>
    <button id="skipPlan" class="btn btn-link mt-4" type="button">Skip for now</button>
</main>

<!-- Message popup -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="toast" class="toast text-bg-warning" role="status" aria-live="polite" aria-atomic="true">
        <div class="toast-body fw-semibold" id="toastMsg"></div>
    </div>
</div>

<!-- order matters: Bootstrap, then common.js, then this page's script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link href="css/signuplogin.css" rel="stylesheet">
<script src="js/common.js"></script>
<script src="js/userauthentication.js"></script>
</body>
</html>
